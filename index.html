<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KROMA Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700;800&family=Permanent+Marker&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: scène 3D fixe en fond, pages routées en hash, sections en couches de verre clair, marqueurs néon au feutre par dessus */
:root{
  color-scheme: light;
  --bg:#FBF7FF;          /* blanc lilas */
  --bg2:#F1EBFF;
  --ink:#1D1438;         /* encre violette profonde pour le texte */
  --ink2:#5A4F7A;
  --line:#E2D8F7;
  --pink:#FF2E93;
  --cyan:#00C2F0;
  --violet:#7B5CFF;
  --lime:#9BE62A;
  --orange:#FF8A1F;
  --yellow:#FFD83D;
  --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.86);
  --f-display:"Sora", ui-sans-serif, system-ui, sans-serif;
  --f-marker:"Permanent Marker", "Comic Sans MS", cursive;
  --f-mono:"JetBrains Mono", ui-monospace, monospace;
  --r:22px;
  --gutter:clamp(16px,4vw,48px);
  --maxw:1200px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-display);font-size:16px;line-height:1.6;overflow-x:hidden}
a{color:inherit}
::selection{background:var(--pink);color:#fff}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:8px}

/* ---------- fond 3D ---------- */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none}
#scene canvas{width:100%;height:100%;display:block}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.35;
  background-image:radial-gradient(circle at 20% 10%,rgba(255,46,147,.14),transparent 40%),radial-gradient(circle at 85% 30%,rgba(0,194,240,.16),transparent 45%),radial-gradient(circle at 50% 95%,rgba(123,92,255,.14),transparent 45%)}
#progress{position:fixed;top:0;left:0;height:4px;width:0;z-index:60;background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan),var(--lime));box-shadow:0 0 12px var(--pink)}
#cursor{position:fixed;left:-20px;top:-20px;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--pink);opacity:.55;pointer-events:none;z-index:80;transition:transform .15s,opacity .15s}
#cursor.hot{transform:scale(1.6);opacity:.8}
@media (hover:none){#cursor{display:none}}

/* ---------- nav ---------- */
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;padding-inline:var(--gutter);padding-block:14px}
.nav-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:18px;background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:10px 12px 10px 22px;box-shadow:0 10px 30px rgba(123,92,255,.10)}
.logo{font-weight:800;font-size:20px;letter-spacing:.06em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo b{font-family:var(--f-marker);font-weight:400;color:var(--pink);letter-spacing:0;text-shadow:0 0 10px rgba(255,46,147,.45)}
.logo .dot{width:12px;height:12px;border-radius:50%;background:conic-gradient(var(--pink),var(--yellow),var(--lime),var(--cyan),var(--violet),var(--pink));animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.menu{display:flex;gap:4px;margin-left:auto;align-items:center;list-style:none;padding:0;margin-block:0}
.menu a,.menu button.dd{font:600 14px var(--f-display);text-decoration:none;padding:9px 14px;border-radius:999px;border:0;background:none;color:var(--ink);cursor:pointer}
.menu a:hover,.menu button.dd:hover,.menu a.on{background:var(--bg2);color:var(--violet)}
.has-dd{position:relative}
.dd-panel{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(6px);min-width:300px;background:var(--glass-strong);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:20px;padding:10px;box-shadow:0 20px 50px rgba(29,20,56,.14);opacity:0;visibility:hidden;transition:.22s}
.has-dd:hover .dd-panel,.has-dd:focus-within .dd-panel{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.dd-panel a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:14px}
.dd-panel small{display:block;font-weight:400;color:var(--ink2);font-size:12px}
.chip-dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.btn{--c:var(--pink);display:inline-flex;align-items:center;gap:10px;font:700 15px var(--f-display);text-decoration:none;border:0;cursor:pointer;padding:14px 24px;border-radius:999px;color:#fff;background:var(--c);box-shadow:0 8px 24px color-mix(in srgb,var(--c) 45%,transparent),0 0 0 0 var(--c);transition:transform .2s,box-shadow .2s;will-change:transform}
.btn:hover{box-shadow:0 12px 34px color-mix(in srgb,var(--c) 60%,transparent),0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.btn.ghost{background:var(--glass-strong);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.btn.ghost:hover{box-shadow:6px 6px 0 var(--pink)}
.btn.sm{padding:10px 18px;font-size:14px}
.burger{display:none;margin-left:auto;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 16px;font:700 14px var(--f-display);cursor:pointer}
@media (max-width:980px){
  .menu{display:none}
  .burger{display:block}
  .nav-cta{display:none}
}
#mobile{position:fixed;inset:0;z-index:70;background:var(--bg);padding:calc(24px + env(safe-area-inset-top,0px)) var(--gutter) 24px;display:flex;flex-direction:column;gap:6px;overflow:auto}
#mobile a{font:800 28px var(--f-display);text-decoration:none;padding:6px 0}
#mobile a.sub{font-size:18px;font-weight:600;color:var(--ink2);padding-left:18px}
#mobile .close{align-self:flex-end;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:10px 16px;font:700 14px var(--f-display)}

/* ---------- structure pages ---------- */
main{position:relative;z-index:2}
.page{animation:pageIn .7s cubic-bezier(.2,.8,.2,1)}
@keyframes pageIn{from{transform:translateY(24px);filter:blur(6px)}to{transform:none;filter:none}}
.wipe{position:fixed;inset:0;z-index:65;pointer-events:none;background:linear-gradient(115deg,var(--pink),var(--violet) 40%,var(--cyan));clip-path:polygon(0 0,0 0,0 100%,0 100%)}
.wipe.go{animation:wipe .75s cubic-bezier(.7,0,.2,1)}
@keyframes wipe{0%{clip-path:polygon(0 0,0 0,0 100%,0 100%)}45%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}100%{clip-path:polygon(100% 0,100% 0,100% 100%,100% 100%)}}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}
section{padding-block:clamp(56px,9vw,110px)}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--violet);display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:28px;height:2px;background:currentColor;box-shadow:0 0 8px currentColor}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.05;letter-spacing:-.02em}
h1{font-size:clamp(42px,8.2vw,108px);font-weight:800}
h2{font-size:clamp(32px,5vw,62px);font-weight:800}
h3{font-size:clamp(20px,2.2vw,26px);font-weight:700}
p.lead{font-size:clamp(17px,1.6vw,21px);color:var(--ink2);max-width:62ch;font-weight:300}
.marker{font-family:var(--f-marker);font-weight:400;letter-spacing:0;position:relative;display:inline-block;transform:rotate(-3deg);color:var(--c,var(--pink));text-shadow:0 0 18px color-mix(in srgb,var(--c,var(--pink)) 55%,transparent)}
.scribble{position:relative;display:inline-block}
.scribble svg{position:absolute;left:-4%;bottom:-.18em;width:108%;height:.42em;overflow:visible}
.scribble path{fill:none;stroke:var(--c,var(--yellow));stroke-width:9;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.1s .35s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.neon{color:#fff;-webkit-text-stroke:0;text-shadow:0 0 6px var(--c,var(--pink)),0 0 18px var(--c,var(--pink)),0 0 34px var(--c,var(--pink))}
.stroke{color:transparent;-webkit-text-stroke:2px var(--ink)}
.center{text-align:center}
.center p.lead{margin-inline:auto}

/* reveal au scroll : état de repos visible, simple décalage animé */
.rv{transition:transform .9s cubic-bezier(.2,.8,.2,1),filter .9s}
.rv.pre{transform:translateY(40px) rotateX(8deg);filter:blur(3px)}

/* ---------- hero ---------- */
.hero{padding-block:clamp(40px,7vw,90px) clamp(40px,6vw,70px)}
.hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:end}
.hero h1 .l{display:block}
.hero h1 .marker{font-size:.92em}
.hero .lead{margin-top:26px}
.hero-ctas{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.sticker{position:relative;background:var(--glass-strong);border:2px solid var(--ink);border-radius:26px;padding:22px;box-shadow:8px 8px 0 var(--violet);transform:rotate(2deg)}
.sticker .tag{position:absolute;top:-18px;right:18px;font-family:var(--f-marker);background:var(--yellow);padding:4px 14px;border-radius:10px;transform:rotate(4deg);border:2px solid var(--ink)}
.sticker ul{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:10px}
.sticker li{display:flex;gap:10px;align-items:center;font-weight:600}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 var(--lime);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.sticker{transform:none}}

/* ticker */
.ticker{overflow:hidden;border-block:2px solid var(--ink);background:var(--ink);color:#fff;transform:rotate(-1.5deg);margin-block:10px;padding-block:14px}
.ticker .track{display:flex;gap:40px;width:max-content;animation:tick 26s linear infinite;font:800 clamp(22px,3vw,36px) var(--f-display);white-space:nowrap}
.ticker .track span:nth-child(3n+1){color:var(--pink);text-shadow:0 0 12px var(--pink)}
.ticker .track span:nth-child(3n+2){font-family:var(--f-marker);font-weight:400;color:var(--yellow)}
.ticker .track span:nth-child(3n){color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
@keyframes tick{to{transform:translateX(-50%)}}

/* cartes services */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px;margin-top:44px;perspective:1000px}
.card{--c:var(--pink);position:relative;display:flex;flex-direction:column;gap:12px;text-decoration:none;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);padding:26px;min-height:270px;transform-style:preserve-3d;transition:transform .25s ease,box-shadow .25s,border-color .25s;overflow:hidden}
.card::after{content:"";position:absolute;inset:auto -30% -60% auto;width:220px;height:220px;border-radius:50%;background:var(--c);filter:blur(60px);opacity:.28;transition:opacity .3s}
.card:hover{border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 18px 50px color-mix(in srgb,var(--c) 35%,transparent)}
.card:hover::after{opacity:.55}
.card .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 0 22px var(--c);transform:translateZ(40px)}
.card h3{transform:translateZ(30px)}
.card p{margin:0;color:var(--ink2);transform:translateZ(20px)}
.card .from{margin-top:auto;font:500 13px var(--f-mono);color:var(--ink);transform:translateZ(25px)}
.card .from b{font-family:var(--f-display);font-size:22px;color:var(--c)}
.card .arrow{position:absolute;top:22px;right:22px;font-size:22px;transition:transform .25s}
.card:hover .arrow{transform:translate(4px,-4px) rotate(-8deg)}

/* défilement horizontal épinglé */
.hscroll{position:relative;height:320vh;padding:0}
.hs-sticky{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:center;overflow:hidden;gap:34px}
.hs-track{display:flex;gap:28px;padding-inline:var(--gutter);will-change:transform}
.step{--c:var(--pink);flex:none;width:min(80vw,420px);min-height:320px;background:var(--glass-strong);border:2px solid var(--ink);border-radius:28px;padding:30px;box-shadow:10px 10px 0 var(--c);display:flex;flex-direction:column;gap:14px}
.step .n{font-family:var(--f-marker);font-size:64px;line-height:1;color:var(--c);text-shadow:0 0 16px color-mix(in srgb,var(--c) 50%,transparent)}
.step p{margin:0;color:var(--ink2)}
@media (max-width:760px),(prefers-reduced-motion:reduce){
  .hscroll{height:auto;padding-block:70px}
  .hs-sticky{position:static;height:auto}
  .hs-track{flex-direction:column;transform:none!important}
  .step{width:100%}
}

/* bandeau GEO */
.geo-band{border-radius:36px;padding:clamp(28px,5vw,60px);background:linear-gradient(120deg,#fff 0%,#F6EEFF 50%,#E9FAFF 100%);border:2px solid var(--ink);box-shadow:12px 12px 0 var(--cyan);display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
.chat{background:var(--ink);color:#fff;border-radius:22px;padding:20px;font-size:14px;display:grid;gap:12px;min-width:0}
.bubble{padding:12px 14px;border-radius:16px;max-width:92%}
.bubble.q{background:#3A2E63;justify-self:end}
.bubble.a{background:#fff;color:var(--ink)}
.bubble.a mark{background:none;color:var(--pink);font-weight:700;text-shadow:0 0 10px rgba(255,46,147,.35)}
.typing::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--cyan)}
@keyframes blink{50%{opacity:0}}
@media (max-width:860px){.geo-band{grid-template-columns:1fr}}

/* page service */
.svc-hero{padding-block:clamp(40px,6vw,80px) 20px}
.crumbs{font:500 13px var(--f-mono);color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--violet)}
.svc-hero h1{font-size:clamp(40px,7vw,92px);margin-top:18px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:22px;margin-top:40px;align-items:stretch}
.tier{--c:var(--pink);position:relative;background:var(--glass-strong);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:14px;transition:transform .25s,box-shadow .25s}
.tier:hover{transform:translateY(-6px);box-shadow:0 20px 50px color-mix(in srgb,var(--c) 28%,transparent)}
.tier.star{border:2px solid var(--c);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 14%,transparent),0 0 40px color-mix(in srgb,var(--c) 30%,transparent)}
.tier .badge{position:absolute;top:-14px;left:24px;font-family:var(--f-marker);background:var(--c);color:#fff;padding:3px 14px;border-radius:10px;transform:rotate(-3deg);box-shadow:0 0 16px var(--c)}
.tier .name{font:800 26px var(--f-display)}
.tier .desc{color:var(--ink2);margin:0;font-size:15px}
.price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.price b{font:800 clamp(34px,4vw,44px) var(--f-display);color:var(--c);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price span{font:500 13px var(--f-mono);color:var(--ink2)}
.feats{list-style:none;padding:0;margin:0;display:grid;gap:9px;font-size:15px}
.feats li{display:grid;grid-template-columns:20px 1fr;gap:8px}
.feats li::before{content:"✦";color:var(--c)}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:10px}
.pill{font:500 12px var(--f-mono);padding:5px 10px;border-radius:999px;background:var(--bg2);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.process{counter-reset:s;list-style:none;padding:0;margin:26px 0 0;display:grid;gap:14px}
.process li{counter-increment:s;display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px}
.process li::before{content:counter(s);font-family:var(--f-marker);font-size:30px;line-height:1;color:var(--c,var(--pink));text-align:center;padding-top:4px}
.process b{display:block}
.process span{color:var(--ink2);font-size:15px}
.note{background:var(--yellow);border:2px solid var(--ink);border-radius:18px;padding:18px 20px;transform:rotate(-1deg);box-shadow:6px 6px 0 var(--ink);font-weight:600}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:flex;justify-content:space-between;gap:14px;padding:14px 16px;border-radius:14px;background:var(--glass-strong);border:1px dashed var(--c,var(--pink))}
.opt b{font-variant-numeric:tabular-nums;white-space:nowrap}

/* tarifs */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px}
.tab{font:700 14px var(--f-display);padding:10px 18px;border-radius:999px;border:2px solid var(--ink);background:var(--glass-strong);cursor:pointer;color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:0 0 0 3px var(--pink)}
.ptable{margin-top:26px;overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--glass-strong)}
.ptable table{width:100%;border-collapse:collapse;min-width:640px}
.ptable th,.ptable td{padding:16px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.ptable th{font:500 12px var(--f-mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink2);background:var(--bg2)}
.ptable td.p{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.ptable tr:hover td{background:rgba(255,46,147,.05)}
.svc-tag{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:22px;margin-top:34px}
.pack{--c:var(--violet);border-radius:28px;padding:28px;color:#fff;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 55%,var(--pink)));box-shadow:0 20px 50px color-mix(in srgb,var(--c) 40%,transparent);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.pack::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.25),transparent 30%);animation:spin 7s linear infinite}
.pack>*{position:relative}
.pack .old{text-decoration:line-through;opacity:.75;font-variant-numeric:tabular-nums}
.pack .big{font:800 44px var(--f-display);font-variant-numeric:tabular-nums}
.pack .save{font-family:var(--f-marker);background:#fff;color:var(--c);padding:2px 12px;border-radius:10px;align-self:flex-start;transform:rotate(-3deg)}
.pack ul{margin:0;padding-left:18px}

/* FAQ */
.faq-tools{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:10px;background:var(--glass-strong);border:2px solid var(--ink);border-radius:999px;padding:4px 18px}
.search input{flex:1;border:0;background:none;font:500 16px var(--f-display);padding:10px 0;color:var(--ink);min-width:0}
.search input:focus{outline:none}
.faq{display:grid;gap:12px;margin-top:26px}
.qa{background:var(--glass-strong);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.qa[open]{border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,46,147,.14)}
.qa summary{list-style:none;cursor:pointer;padding:20px 22px;font-weight:700;display:flex;gap:16px;align-items:center;justify-content:space-between}
.qa summary::-webkit-details-marker{display:none}
.qa summary .plus{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);transition:transform .3s,background .3s;font-weight:800}
.qa[open] summary .plus{transform:rotate(45deg);background:var(--pink);color:#fff}
.qa .ans{padding:0 22px 22px;color:var(--ink2);max-width:75ch}
.qa .cat{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--violet);display:block;margin-bottom:4px}
.empty{padding:30px;text-align:center;color:var(--ink2)}

/* formulaires */
.form-card{background:var(--glass-strong);backdrop-filter:blur(14px);border:2px solid var(--ink);border-radius:30px;padding:clamp(22px,4vw,40px);box-shadow:12px 12px 0 var(--pink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font:600 14px var(--f-display)}
.field input,.field select,.field textarea{font:400 16px var(--f-display);color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:14px;padding:13px 15px;transition:border-color .2s,box-shadow .2s;width:100%}
.field textarea{min-height:130px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 4px rgba(123,92,255,.18)}
.field.err input,.field.err select,.field.err textarea{border-color:var(--pink)}
.field .msg{font-size:13px;color:var(--pink);min-height:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{cursor:pointer}
.checks input{position:absolute;opacity:0;pointer-events:none}
.checks span{display:inline-block;padding:9px 14px;border-radius:999px;border:2px solid var(--line);font:600 14px var(--f-display);background:#fff;transition:.2s}
.checks input:checked+span{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 0 0 3px var(--cyan)}
.checks input:focus-visible+span{outline:3px solid var(--cyan);outline-offset:2px}
.form-actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:22px}
.small{font-size:13px;color:var(--ink2)}
.success{text-align:center;padding:30px 10px;display:grid;gap:14px;justify-items:center}
.success .big{font-family:var(--f-marker);font-size:clamp(40px,6vw,64px);color:var(--lime);text-shadow:0 0 18px rgba(155,230,42,.6);transform:rotate(-3deg)}
.contact-side{display:grid;gap:16px}
.cinfo{background:var(--glass-strong);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:6px}
.cinfo .v{font-weight:700;font-size:18px;user-select:all;overflow-wrap:anywhere}
.copy{justify-self:start;font:600 13px var(--f-display);border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}

/* calendrier */
.booking{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:start}
@media (max-width:900px){.booking{grid-template-columns:1fr}}
.cal{background:var(--glass-strong);backdrop-filter:blur(14px);border:2px solid var(--ink);border-radius:30px;padding:clamp(18px,3vw,30px);box-shadow:12px 12px 0 var(--cyan)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.cal-head h3{text-transform:capitalize}
.navb{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink);background:#fff;cursor:pointer;font:800 18px var(--f-display);color:var(--ink)}
.navb:disabled{opacity:.3;cursor:not-allowed}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow span{text-align:center;font:500 12px var(--f-mono);color:var(--ink2);padding-bottom:6px}
.day{aspect-ratio:1;max-width:100%;border-radius:14px;border:2px solid transparent;background:#fff;font:700 15px var(--f-display);cursor:pointer;color:var(--ink);position:relative;transition:transform .15s,background .2s,box-shadow .2s;font-variant-numeric:tabular-nums}
.day:hover:not(:disabled){transform:scale(1.08);border-color:var(--violet)}
.day:disabled{background:transparent;color:#C4BADB;cursor:not-allowed}
.day.today::after{content:"";position:absolute;bottom:6px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--pink)}
.day.sel{background:var(--pink);color:#fff;box-shadow:0 0 18px var(--pink)}
.day.blank{visibility:hidden}
.slots-box{display:grid;gap:14px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.slot{padding:11px 6px;border-radius:12px;border:2px solid var(--line);background:#fff;font:700 14px var(--f-mono);cursor:pointer;color:var(--ink);transition:.15s}
.slot:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 12px rgba(0,194,240,.35)}
.slot:disabled{text-decoration:line-through;opacity:.4;cursor:not-allowed}
.slot.sel{background:var(--cyan);border-color:var(--cyan);color:#fff;box-shadow:0 0 16px var(--cyan)}
.recap{background:var(--ink);color:#fff;border-radius:18px;padding:16px 18px;display:grid;gap:4px}
.recap b{color:var(--yellow)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}

/* à propos */
.team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:26px;margin-top:40px}
.member{--c:var(--pink);background:var(--glass-strong);border:2px solid var(--ink);border-radius:30px;padding:28px;box-shadow:10px 10px 0 var(--c);display:grid;gap:14px}
.avatar{width:120px;height:120px;border-radius:50%;border:3px dashed var(--c);display:grid;place-items:center;font-family:var(--f-marker);font-size:18px;color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff);text-align:center;line-height:1.1}
.ph{background:repeating-linear-gradient(-45deg,var(--bg2),var(--bg2) 10px,#fff 10px,#fff 20px);border-radius:10px;padding:2px 8px;color:var(--ink2);font-style:italic}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px;margin-top:34px}
.val{padding:22px;border-radius:22px;background:var(--glass);border:1px solid var(--line)}
.val .marker{font-size:28px}

/* CTA et footer */
.cta{border-radius:40px;padding:clamp(34px,6vw,80px);background:var(--ink);color:#fff;text-align:center;position:relative;overflow:hidden}
.cta::before{content:"";position:absolute;inset:-50%;background:radial-gradient(circle at 30% 40%,rgba(255,46,147,.45),transparent 35%),radial-gradient(circle at 70% 60%,rgba(0,194,240,.45),transparent 35%);animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(8%,-6%) rotate(20deg)}}
.cta>*{position:relative}
.cta p{color:#D9D0F5;max-width:55ch;margin:18px auto 30px}
footer{position:relative;z-index:2;padding-block:50px 40px;padding-inline:var(--gutter)}
.foot{max-width:var(--maxw);margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:28px;border-top:2px solid var(--ink);padding-top:34px}
.foot h4{margin:0 0 10px;font:500 12px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--violet)}
.foot a{display:block;text-decoration:none;padding:3px 0;color:var(--ink2)}
.foot a:hover{color:var(--pink)}
.demo{display:inline-block;margin-top:14px;font:500 12px var(--f-mono);background:var(--yellow);padding:3px 10px;border-radius:8px}
@media (max-width:760px){.foot{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;z-index:90;transition:transform .35s;font-weight:600}
.toast.on{transform:translateX(-50%) translateY(0)}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .scribble path{stroke-dashoffset:0}
  .rv.pre{transform:none;filter:none}
}
</style>

function setupPage(route){
  // reveal
  const els=$$('.rv');
  if(!reduce && 'IntersectionObserver' in window){
    const vh=innerHeight;
    els.forEach(el=>{if(el.getBoundingClientRect().top>vh*0.92) el.classList.add('pre')});
    const io=new IntersectionObserver(ents=>ents.forEach(en=>{if(en.isIntersecting){en.target.classList.remove('pre');io.unobserve(en.target)}}),{threshold:.12});
    els.forEach(el=>io.observe(el));
  }
  // tilt 3D sur les cartes
  if(!reduce && matchMedia('(hover:hover)').matches){
    $$('.tilt').forEach(c=>{
      c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*14}deg) rotateX(${-y*14}deg) translateZ(0)`});
      c.addEventListener('mouseleave',()=>c.style.transform='');
    });
    $$('.mag').forEach(b=>{
      b.addEventListener('mousemove',e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.18}px,${(e.clientY-r.top-r.height/2)*.28}px)`});
      b.addEventListener('mouseleave',()=>b.style.transform='');
    });
  }
  $$('a,button,summary,.day,.slot').forEach(el=>{el.addEventListener('mouseenter',()=>cursor.classList.add('hot'));el.addEventListener('mouseleave',()=>cursor.classList.remove('hot'))});

  if(route==='accueil') setupHome();
  if(route==='tarifs') setupTarifs();
  if(route==='faq') setupFaq();
  if(route==='contact') setupContact();
  if(route==='rdv') setupRdv();
}

/* ---------- calendrier de prise d’appel ---------- */
function setupRdv(){
  const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const maxDate=new Date(today);maxDate.setDate(maxDate.getDate()+60);
  let view=new Date(today.getFullYear(),today.getMonth(),1);
  let selDay=null, selSlot=null;
  const fmtM=new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'});
  const fmtD=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  const holidays=['01-01','05-01','05-08','07-14','08-15','11-01','11-11','12-25'];
  const key=d=>`${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const closed=d=>d<today||d>maxDate||d.getDay()===0||d.getDay()===6||holidays.includes(key(d));
  const SLOTS=[];for(let h=9;h<18;h++){for(const m of [0,30]){if(h===9&&m===0)continue;if(h===12&&m===30)continue;if(h===13&&m===0)continue;SLOTS.push(`${h}:${m?'30':'00'}`)}}
  const taken=(d,s)=>{let x=d.getDate()*31+d.getMonth()*7+parseInt(s)*13+(s.endsWith('30')?5:0);return (x*2654435761>>>0)%4===0};

  function drawCal(){
    $('#calTitle').textContent=fmtM.format(view);
    $('#prevM').disabled=view<=new Date(today.getFullYear(),today.getMonth(),1);
    $('#nextM').disabled=new Date(view.getFullYear(),view.getMonth()+1,1)>maxDate;
    const first=(view.getDay()+6)%7;const n=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
    let h='';for(let i=0;i<first;i++)h+='<span class="day blank"></span>';
    for(let d=1;d<=n;d++){const dt=new Date(view.getFullYear(),view.getMonth(),d);
      const cls=['day'];if(+dt===+today)cls.push('today');if(selDay&&+dt===+selDay)cls.push('sel');
      h+=`<button type="button" class="${cls.join(' ')}" data-d="${d}" ${closed(dt)?'disabled':''} aria-label="${fmtD.format(dt)}${closed(dt)?', fermé':''}">${d}</button>`}
    $('#calDays').innerHTML=h;
    $$('#calDays .day:not(:disabled):not(.blank)').forEach(b=>b.addEventListener('click',()=>{selDay=new Date(view.getFullYear(),view.getMonth(),+b.dataset.d);selSlot=null;drawCal();drawSlots();
      if(innerWidth<900) $('#slotTitle').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'})}));
  }
  function drawSlots(){
    $('#bookForm').hidden=true;
    if(!selDay){$('#slots').innerHTML='';return}
    const isToday=+selDay===+today;
    $('#slotTitle').textContent=fmtD.format(selDay).replace(/^./,c=>c.toUpperCase());
    $('#slots').innerHTML=SLOTS.map(s=>{const [hh,mm]=s.split(':').map(Number);const past=isToday&&(hh*60+mm)<=now.getHours()*60+now.getMinutes()+60;
      const dis=past||taken(selDay,s);return `<button type="button" class="slot ${selSlot===s?'sel':''}" data-s="${s}" ${dis?'disabled':''} aria-label="${s.replace(':',' h ')}${dis?', indisponible':''}">${s.replace(':','h')}</button>`}).join('');
    if(!$$('#slots .slot:not(:disabled)').length) $('#slots').innerHTML='<p class="small">Plus de créneau ce jour là, choisissez un autre jour.</p>';
    $$('#slots .slot:not(:disabled)').forEach(b=>b.addEventListener('click',()=>{selSlot=b.dataset.s;drawSlots();showForm()}));
  }
  function recapHTML(){const [h,m]=selSlot.split(':');const end=new Date(2000,0,1,+h,+m+20);
    return `<span>Appel téléphonique de 20 minutes</span><span><b>${fmtD.format(selDay)}</b></span><span>de <b>${selSlot.replace(':','h')}</b> à <b>${end.getHours()}h${String(end.getMinutes()).padStart(2,'0')}</b>, heure de Paris</span>`}
  function showForm(){$('#recap').innerHTML=recapHTML();$('#bookForm').hidden=false;setTimeout(()=>$('#b_name').focus({preventScroll:true}),50)}
  $('#prevM').addEventListener('click',()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);drawCal()});
  $('#nextM').addEventListener('click',()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);drawCal()});
  $('#bookForm').addEventListener('submit',e=>{e.preventDefault();let ok=true;
    const n=$('#b_name'),p=$('#b_phone'),m=$('#b_email');
    if(n.value.trim().length<2){setErr(n,'Indiquez votre nom.');ok=false}else setErr(n,'');
    if(!PHONE_RE.test(p.value.trim())){setErr(p,'Numéro attendu : 06 12 34 56 78.');ok=false}else setErr(p,'');
    if(!EMAIL_RE.test(m.value.trim())){setErr(m,'Email invalide, format nom@domaine.fr.');ok=false}else setErr(m,'');
    if(!ok){toast('Vérifiez vos coordonnées');return}
    $('#okRecap').innerHTML=recapHTML()+`<span>On vous appelle au <b>${esc(p.value.trim())}</b></span><span>Sujet : ${esc($('#b_topic').value)}</span>`;
    $('#bookStep1').hidden=true;$('#bookOk').hidden=false;confetti();
  });
  $('#bookAgain').addEventListener('click',()=>{selSlot=null;$('#bookOk').hidden=true;$('#bookStep1').hidden=false;drawSlots()});
  // premier jour ouvré sélectionné pour montrer l’outil en état de marche
  let d=new Date(today);while(closed(d)&&d<=maxDate)d.setDate(d.getDate()+1);
  if(d<=maxDate){selDay=d;view=new Date(d.getFullYear(),d.getMonth(),1)}
  drawCal();drawSlots();
}

/* confettis néon */
function confetti(){
  if(reduce)return;const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;z-index:95;pointer-events:none';document.body.appendChild(cv);
  const ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#FF2E93','#00C2F0','#7B5CFF','#9BE62A','#FFD83D','#FF8A1F'];
  const P=Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,r:Math.random()*6+3,c:cols[Math.random()*6|0],a:Math.random()*6}));
  let t=0;(function f(){ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=10;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});
    if(++t<110)requestAnimationFrame(f);else cv.remove()})();
}

const Scene=(function(){
  const api={setRoute(){},scroll(){},mouse(){}};
  if(!window.THREE)return api;
  const host=$('#scene');let W=innerWidth,H=innerHeight;
  let renderer;try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){return api}
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(W,H);host.appendChild(renderer.domElement);
  const scene=new THREE.Scene();const cam=new THREE.PerspectiveCamera(42,W/H,.1,100);cam.position.set(0,0,9);

  const uni={uTime:{value:0},uA:{value:new THREE.Color(0xFF2E93)},uB:{value:new THREE.Color(0x00C2F0)},uC:{value:new THREE.Color(0x7B5CFF)},uAmp:{value:.35}};
  const blobMat=new THREE.ShaderMaterial({uniforms:uni,transparent:true,
    vertexShader:`uniform float uTime;uniform float uAmp;varying vec3 vN;varying vec3 vP;
      vec3 hash3(vec3 p){p=vec3(dot(p,vec3(127.1,311.7,74.7)),dot(p,vec3(269.5,183.3,246.1)),dot(p,vec3(113.5,271.9,124.6)));return -1.+2.*fract(sin(p)*43758.5453);}
      float noise(vec3 p){vec3 i=floor(p),f=fract(p);vec3 u=f*f*(3.-2.*f);
        return mix(mix(mix(dot(hash3(i),f),dot(hash3(i+vec3(1,0,0)),f-vec3(1,0,0)),u.x),mix(dot(hash3(i+vec3(0,1,0)),f-vec3(0,1,0)),dot(hash3(i+vec3(1,1,0)),f-vec3(1,1,0)),u.x),u.y),
                   mix(mix(dot(hash3(i+vec3(0,0,1)),f-vec3(0,0,1)),dot(hash3(i+vec3(1,0,1)),f-vec3(1,0,1)),u.x),mix(dot(hash3(i+vec3(0,1,1)),f-vec3(0,1,1)),dot(hash3(i+vec3(1,1,1)),f-vec3(1,1,1)),u.x),u.y),u.z);}
      void main(){float n=noise(normal*1.6+uTime*.35);vec3 p=position+normal*n*uAmp;vN=normalize(normalMatrix*normal);vP=p;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
    fragmentShader:`uniform vec3 uA;uniform vec3 uB;uniform vec3 uC;uniform float uTime;varying vec3 vN;varying vec3 vP;
      void main(){float f=pow(1.-abs(vN.z),1.6);float t=.5+.5*sin(vP.y*1.4+uTime*.6);vec3 col=mix(mix(uA,uB,t),uC,.5+.5*vN.x);
        col=mix(vec3(1.),col,.55+.45*f);gl_FragColor=vec4(col,.92);}`});
  const blob=new THREE.Mesh(new THREE.IcosahedronGeometry(1.9,64),blobMat);scene.add(blob);

  const wireMat=new THREE.MeshBasicMaterial({color:0x7B5CFF,wireframe:true,transparent:true,opacity:.35});
  const ring=new THREE.Mesh(new THREE.TorusGeometry(3.1,.02,8,160),new THREE.MeshBasicMaterial({color:0xFF2E93,transparent:true,opacity:.7}));ring.rotation.x=1.25;scene.add(ring);
  const ring2=new THREE.Mesh(new THREE.TorusGeometry(3.6,.015,8,160),new THREE.MeshBasicMaterial({color:0x00C2F0,transparent:true,opacity:.6}));ring2.rotation.set(1.1,.5,0);scene.add(ring2);
  const floaters=[];const geos=[new THREE.OctahedronGeometry(.35),new THREE.TorusKnotGeometry(.25,.08,64,8),new THREE.IcosahedronGeometry(.3,0),new THREE.BoxGeometry(.4,.4,.4)];
  const cols=[0xFF2E93,0x00C2F0,0x9BE62A,0xFFD83D,0x7B5CFF,0xFF8A1F];
  for(let i=0;i<14;i++){const m=new THREE.Mesh(geos[i%4],new THREE.MeshBasicMaterial({color:cols[i%6],wireframe:i%3===0,transparent:true,opacity:.85}));
    const a=i/14*Math.PI*2;m.userData={a,r:4+Math.random()*2.2,y:(Math.random()-.5)*5,s:.2+Math.random()*.4};scene.add(m);floaters.push(m)}
  const shell=new THREE.Mesh(new THREE.IcosahedronGeometry(2.6,2),wireMat);scene.add(shell);

  let mx=0,my=0,sp=0,target={x:2.6,y:.2,s:1};
  const POS={accueil:{x:2.9,y:.1,s:1.05},services:{x:3.4,y:.6,s:.8},tarifs:{x:3.8,y:1.6,s:.6},faq:{x:-3.6,y:1.2,s:.6},contact:{x:3.8,y:1.8,s:.55},rdv:{x:-3.8,y:1.8,s:.55},apropos:{x:3.2,y:.8,s:.8}};
  function place(){const mobile=W<760;const p=target;blob.userData.t={x:mobile?0:p.x,y:mobile?2.4:p.y,s:mobile?.7:p.s}}
  api.setRoute=r=>{const s=SERVICES[r];target=POS[r]||{x:3.2,y:.5,s:.85};place();
    const a=s?new THREE.Color(s.hex):new THREE.Color(0xFF2E93);uni.uA.value.lerp(a,1);
    if(s){uni.uB.value.set(r==='web'?0x7B5CFF:0x00C2F0)}else uni.uB.value.set(0x00C2F0)};
  api.scroll=p=>{sp=p};api.mouse=(x,y)=>{mx=x;my=y};
  place();
  addEventListener('resize',()=>{W=innerWidth;H=innerHeight;renderer.setSize(W,H);cam.aspect=W/H;cam.updateProjectionMatrix();place()});
  const clock=new THREE.Clock();let cur={x:0,y:0,s:1};
  function frame(){const t=clock.getElapsedTime();uni.uTime.value=reduce?0:t;
    const tt=blob.userData.t||{x:0,y:0,s:1};cur.x+=(tt.x-cur.x)*.05;cur.y+=(tt.y-cur.y)*.05;cur.s+=(tt.s-cur.s)*.05;
    const g=new THREE.Vector3(cur.x+mx*.6,cur.y-sp*1.8-my*.4,0);
    [blob,shell,ring,ring2].forEach(o=>o.position.copy(g));
    blob.scale.setScalar(cur.s*(1+Math.sin(t*1.2)*.02));shell.scale.setScalar(cur.s);ring.scale.setScalar(cur.s);ring2.scale.setScalar(cur.s);
    blob.rotation.y=t*.15+sp*3;blob.rotation.x=my*.5;shell.rotation.y=-t*.1-sp*2;shell.rotation.z=t*.05;
    ring.rotation.z=t*.3+sp*4;ring2.rotation.z=-t*.22;
    floaters.forEach((m,i)=>{const u=m.userData;const a=u.a+t*u.s*.3+sp*2;m.position.set(g.x+Math.cos(a)*u.r*cur.s,g.y+u.y*cur.s+Math.sin(t*u.s+i)*.3,Math.sin(a)*u.r*cur.s*.6-1);m.rotation.x=t*u.s*2;m.rotation.y=t*u.s*1.5;m.scale.setScalar(cur.s)});
    cam.position.x=mx*.4;cam.position.y=-my*.3;cam.lookAt(0,0,0);
    renderer.render(scene,cam);if(!reduce)requestAnimationFrame(frame)}
  if(reduce){frame();setTimeout(frame,300)}else requestAnimationFrame(frame);
  return api;
})();

render(true);onScroll();
</script>

</body>
